<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3f8f68">
  <title>Remit Calculator</title>
  <meta name="description" content="Calculate your income in seconds with Remit Calculator.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Remit Calculator">
  <meta property="og:description" content="Calculate your income in seconds with Remit Calculator.">
  <style>
    :root {
      --ink: #211e19;
      --muted: #6e6759;
      --faint: #a89f8d;
      --line: #ddd5c4;
      --bg: #eae5d9;
      --card: #f6f3ea;
      --field-bg: #e4ded0;
      --accent: #2b2822;
      --bonus: #3f8f68;
      --danger: #c0392b;
      --mono: 'SF Mono', 'Roboto Mono', monospace;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow-y: auto;
      height: 100%;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .screen::-webkit-scrollbar {
      display: none;
    }

    .screen {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 28px 20px 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    h1 {
      font-size: 19px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 24px;
      letter-spacing: -0.01em;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .field-row {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .field {
      flex: 1;
      min-width: 0;
    }
    .field.grow-2 { flex: 1.6; }
    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      gap: 6px;
    }
    .field label.inline {
      justify-content: flex-start;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(33, 30, 25, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility .2s;
      z-index: 100;
    }
    .modal.open {
      opacity: 1;
      visibility: visible;
    }
    .modal-box {
      position: relative;
      width: 100%;
      max-width: 340px;
      max-height: 90vh;
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 16px 20px;
      transform: translateY(8px) scale(0.98);
      transition: transform .2s ease;
    }
    .modal.open .modal-box {
      transform: none;
    }
    .modal-img {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      background: var(--field-bg);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .modal-img img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .modal-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }
    .modal-text {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--muted);
    }
    .modal-close {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(246, 243, 234, 0.92);
      color: var(--ink);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .field label .hint {
      font-size: 10.5px;
      color: var(--faint);
      font-weight: 500;
    }
    .tooltip-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .tooltip-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.3px solid var(--faint);
      background: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .15s, color .15s, background .15s;
    }
    .tooltip-icon:hover,
    .tooltip-wrap.open .tooltip-icon {
      border-color: var(--bonus);
      color: var(--card);
      background: var(--bonus);
    }
    .tooltip-bubble {
      position: absolute;
      bottom: calc(100% + 8px);
      right: -8px;
      width: 190px;
      background: var(--ink);
      color: var(--card);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.45;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: left;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: opacity .15s ease, transform .15s ease;
      pointer-events: none;
      z-index: 10;
    }
    .tooltip-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 10px;
      border: 5px solid transparent;
      border-top-color: var(--ink);
    }
    .tooltip-wrap:hover .tooltip-bubble,
    .tooltip-wrap.open .tooltip-bubble {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .field-wrap {
      display: flex;
      align-items: center;
      background: var(--field-bg);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      transition: border-color .15s, background .15s;
    }
    .field-wrap.focus {
      border-color: var(--ink);
      background: var(--card);
    }
    .field-wrap.bonus.focus {
      border-color: var(--bonus);
      background: var(--card);
    }
    .field-wrap.error {
      border-color: var(--danger);
      background: #fdf1ef;
    }
    .currency {
      font-size: 16px;
      color: var(--muted);
      margin-right: 5px;
      white-space: nowrap;
    }
    .bonus .currency {
      color: var(--bonus);
    }
    .field-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      margin-right: 10px;
      color: var(--muted);
      transition: color .15s;
    }
    .field-wrap.focus .field-icon { color: var(--ink); }
    .field-wrap.error .field-icon { color: var(--danger); }
    input[type="number"] {
      flex: 1;
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      padding: 4px 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      font-family: var(--mono);
      -webkit-appearance: none;
    }
    .field.grow-2 input[type="number"] { font-size: 20px; }
    .field:not(.grow-2) input[type="number"] { font-size: 18px; }
    input::placeholder {
      color: var(--faint);
      font-weight: 500;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    .field.wallet-field {
      margin-bottom: 24px;
    }

    .calc-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      margin-top: 8px;
      cursor: pointer;
      transition: opacity .1s;
    }
    .calc-btn:active {
      opacity: 0.75;
    }

    .form-warning {
      display: none;
      color: var(--danger);
      font-size: 12.5px;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
      animation: fade .2s ease;
    }
    .form-warning.show {
      display: block;
    }

    .results {
      display: none;
      margin-top: 20px;
      animation: fade .25s ease;
    }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 9px 0;
      font-size: 13px;
      color: #777;
    }
    .row .value {
      font-family: var(--mono);
      color: var(--ink);
      font-weight: 600;
    }
    .row .value.bonus {
      color: var(--bonus);
    }
    .row.net {
      border-top: 1px solid var(--line);
      margin-top: 2px;
      padding-top: 14px;
    }
    .row.net .label,
    .row.net .value {
      color: var(--ink);
      font-weight: 700;
      font-size: 14px;
    }
    .final {
      margin-top: 2px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      text-align: left;
    }
    .final-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .final-amount {
      display: inline-block;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity .1s, transform .1s;
      font-family: var(--mono);
      font-size: 44px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .final-amount:active {
      opacity: 0.6;
      transform: scale(0.98);
    }
    .final-amount.copied {
      color: var(--bonus) !important;
    }
    .final-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
    .final-note:empty {
      display: none;
    }
    .final-note.zero {
      color: var(--bonus);
      font-weight: 600;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
      margin: 16px -20px 0;
      padding: 0 20px 4px;
      overflow-y: hidden;
      touch-action: pan-x pan-y;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar {
      display: none;
    }
    .tab {
      flex: 0 0 auto;
      white-space: nowrap;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 18px;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--card);
    }
    .tab-panel {
      margin-top: 12px;
      animation: fade .2s ease;
    }
    .tab-text {
      margin: 0;
      padding: 14px 2px;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--muted);
    }

    .faq-section {
      border-top: 1px solid var(--line);
    }
    .faq-item {
      border-bottom: 1px solid var(--line);
    }
    .faq-q {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: none;
      border: none;
      padding: 16px 2px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      font-family: inherit;
    }
    .faq-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--field-bg);
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      transition: transform .2s ease, background .2s ease;
    }
    .faq-item.open .faq-icon {
      transform: rotate(45deg);
      background: var(--ink);
      color: var(--card);
    }
    .faq-a {
      max-height: 0;
      overflow: hidden;
      transition: max-height .25s ease;
    }
    .faq-a p {
      margin: 0 0 16px;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--muted);
      padding-right: 30px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <h1>Remit Calculator</h1>

    <div class="card">
      <div class="field wallet-field">
        <label for="wallet" class="inline">Wallet
          <button type="button" class="tooltip-icon" data-help="wallet" aria-label="What is Wallet?">?</button>
        </label>
        <div class="field-wrap" id="walletWrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
            <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
          </svg>
          <input type="number" id="wallet" placeholder="-1766.03" inputmode="decimal">
        </div>
      </div>

      <div class="field-row">
        <div class="field grow-2">
          <label for="payments" class="inline">Payments
            <button type="button" class="tooltip-icon" data-help="payments" aria-label="What is Payments?">?</button>
          </label>
          <div class="field-wrap" id="paymentsWrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="15" height="11" x="7" y="4" rx="2"/>
              <circle cx="14.5" cy="9.5" r="2.2"/>
              <path d="M3 8v9a2 2 0 0 0 2 2h12"/>
            </svg>
            <input type="number" id="payments" placeholder="532.82" inputmode="decimal">
          </div>
        </div>
        <div class="field">
          <label for="quest">Quest
            <span class="tooltip-wrap" id="questTooltip">
              <button type="button" class="tooltip-icon" aria-label="What is Quest bonus?">?</button>
              <span class="tooltip-bubble">Quest bonus is extra pay from completed quests or incentives. It gets added on top of your Payments before tax.</span>
            </span>
          </label>
          <div class="field-wrap bonus" id="questWrap">
            <span class="currency">+₱</span>
            <input type="number" id="quest" placeholder="0" inputmode="decimal">
          </div>
        </div>
      </div>

      <button class="calc-btn" onclick="calculateRemit()">Calculate</button>

      <div class="form-warning" id="formWarning">
        <span id="formWarningText">Please fill in Wallet and Payments to calculate.</span>
      </div>
    </div>

    <div class="results card" id="results">
      <div class="row" id="quest-row">
        <span class="label">Quest bonus</span>
        <span class="value bonus" id="quest-display">+₱0.00</span>
      </div>
      <div class="row">
        <span class="label">Gross earnings</span>
        <span class="value" id="gross-display">₱0.00</span>
      </div>
      <div class="row">
        <span class="label">2% tax</span>
        <span class="value" id="tax-display">−₱0.00</span>
      </div>
      <div class="row net">
        <span class="label">Net earnings (Perang makukuha mo)</span>
        <span class="value" id="net-display">₱0.00</span>
      </div>
      <div class="row">
        <span class="label">Wallet debt</span>
        <span class="value" id="debt-display">₱0.00</span>
      </div>

      <div class="final">
        <div class="final-label">Pay at 7-Eleven (Ire-remit mo)</div>
        <div class="final-amount" id="final-display" role="button" tabindex="0" data-copy="">₱0</div>
        <div class="final-note" id="final-note"></div>
      </div>
    </div>

    <div class="tabs" id="tabs" role="tablist">
      <button type="button" class="tab" data-tab="faq" role="tab" aria-selected="false">Faq</button>
      <button type="button" class="tab" data-tab="fakebook" role="tab" aria-selected="false">Fake Book</button>
      <button type="button" class="tab" data-tab="csunavailable" role="tab" aria-selected="false">CS Unavailable</button>
      <button type="button" class="tab" data-tab="acceptance" role="tab" aria-selected="false">Acceptance Rate</button>
      <button type="button" class="tab" data-tab="tipidhacks" role="tab" aria-selected="false">Tipid Hacks</button>
    </div>

    <div id="tabPanel"></div>
  </div>

  <div class="modal" id="helpModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button type="button" class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div class="modal-img"><img id="modalImg" src="" alt=""></div>
      <h3 class="modal-title" id="modalTitle"></h3>
      <p class="modal-text" id="modalText"></p>
    </div>
  </div>

<script>
    ['wallet', 'payments', 'quest'].forEach(id => {
      const input = document.getElementById(id);
      const wrap = document.getElementById(id + 'Wrap');
      input.addEventListener('focus', () => wrap.classList.add('focus'));
      input.addEventListener('blur', () => wrap.classList.remove('focus'));
    });

    document.getElementById('wallet').addEventListener('input', function() {
      if (this.value && this.value > 0) {
        this.value = -this.value;
      }
    });

    ['wallet', 'payments'].forEach(id => {
      document.getElementById(id).addEventListener('input', function() {
        clearFieldError(id);
        if (document.getElementById('wallet').value.trim() !== '' &&
            document.getElementById('payments').value.trim() !== '') {
          hideFormWarning();
        }
      });
    });

    function setFieldError(id) {
      document.getElementById(id + 'Wrap').classList.add('error');
    }

    function clearFieldError(id) {
      document.getElementById(id + 'Wrap').classList.remove('error');
    }

    function showFormWarning(text) {
      const warning = document.getElementById('formWarning');
      document.getElementById('formWarningText').textContent = text;
      warning.classList.add('show');
    }

    function hideFormWarning() {
      document.getElementById('formWarning').classList.remove('show');
    }

    function calculateRemit() {
      let walletInput = document.getElementById('wallet').value;
      let paymentsInput = document.getElementById('payments').value;
      let questInput = document.getElementById('quest').value;

      const walletEmpty = walletInput.trim() === '';
      const paymentsEmpty = paymentsInput.trim() === '';

      clearFieldError('wallet');
      clearFieldError('payments');

      if (walletEmpty || paymentsEmpty) {
        if (walletEmpty) setFieldError('wallet');
        if (paymentsEmpty) setFieldError('payments');

        let msg = 'Please fill in Wallet and Payments to calculate.';
        if (walletEmpty && !paymentsEmpty) msg = 'Please fill in Wallet to calculate.';
        if (paymentsEmpty && !walletEmpty) msg = 'Please fill in Payments to calculate.';
        showFormWarning(msg);
        document.getElementById('results').style.display = 'none';
        return;
      }

      hideFormWarning();

      let rawWallet = parseFloat(walletInput) || 0;
      let rawPayments = parseFloat(paymentsInput) || 0;
      let rawQuest = parseFloat(questInput) || 0;

      let walletBalance = -Math.abs(rawWallet);

      let grossEarnings = rawPayments + rawQuest;
      let tax = grossEarnings * 0.02;
      let netEarnings = grossEarnings - tax;

      let remainingBalance = netEarnings + walletBalance;

      const questRow = document.getElementById('quest-row');
      if (rawQuest > 0) {
        questRow.style.display = 'flex';
        document.getElementById('quest-display').innerText = '+₱' + rawQuest.toFixed(2);
      } else {
        questRow.style.display = 'none';
      }

      document.getElementById('gross-display').innerText = '₱' + grossEarnings.toFixed(2);
      document.getElementById('tax-display').innerText = '−₱' + tax.toFixed(2);
      document.getElementById('net-display').innerText = '₱' + netEarnings.toFixed(2);
      document.getElementById('debt-display').innerText = '−₱' + Math.abs(walletBalance).toFixed(2);

      const finalLabel = document.querySelector('.final-label');
      const finalAmount = document.getElementById('final-display');
      const finalNote = document.getElementById('final-note');

      if (remainingBalance < 0) {
        let exactRemit = Math.abs(remainingBalance);
        let finalRemit = Math.ceil(exactRemit);
        finalLabel.innerText = 'Pay at 7-Eleven (Ire-remit mo)';
        finalAmount.innerText = '₱' + finalRemit;
        finalAmount.dataset.copy = finalRemit;
        finalAmount.style.color = 'var(--ink)';
        finalNote.textContent = '';
        finalNote.classList.remove('zero');
      } else {
        finalLabel.innerText = 'Expected Payout';
        finalAmount.innerText = '₱' + remainingBalance.toFixed(2);
        finalAmount.dataset.copy = remainingBalance.toFixed(2);
        finalAmount.style.color = 'var(--bonus)';
        finalNote.textContent = 'Earnings covered your COD debt! This is your remaining payout.';
        finalNote.classList.add('zero');
      }

      finalAmount.classList.remove('copied');
      document.getElementById('results').style.display = 'block';
    }

    const finalDisplay = document.getElementById('final-display');
    let copyTimer;

    async function copyAmount() {
      const text = finalDisplay.dataset.copy;
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, 99999);
        document.execCommand('copy');
        document.body.removeChild(ta);
      }

      finalDisplay.classList.add('copied');
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => {
        finalDisplay.classList.remove('copied');
      }, 2000);
    }

    finalDisplay.addEventListener('click', copyAmount);
    finalDisplay.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        copyAmount();
      }
    });

    function toggleFaq(btn) {
      const item = btn.closest('.faq-item');
      const answer = item.querySelector('.faq-a');
      const isOpen = item.classList.contains('open');

      if (isOpen) {
        answer.style.maxHeight = '0px';
        item.classList.remove('open');
      } else {
        item.classList.add('open');
        answer.style.maxHeight = answer.scrollHeight + 'px';
      }
    }

    const FAKEBOOK = [
      {
        q: 'Ano ang gagawin ko kapag na fake book ako?',
        a: 'Kapag nasa exact location ka na ni customer, pindutin mo yung "Customer Unavailable" button (Hindi lalabas ang "Customer Unavailable" button kapag wala ka sa exact location). I-click mo yung "Chat" tapos i-type mo "Im here", tapos i-click mo yung "Notify". Mag-antay ka ng 10 mins. Pagkatapos ng 10 mins, i-chat mo na yung support at sabihin mong wala si customer.'
      }
    ];

    const CSUNAVAILABLE = [
      {
        q: 'Ano ang gagawin ko kapag wala si customer?',
        a: 'Kapag nasa exact location ka na ni customer, pindutin mo yung "Customer Unavailable" button (Hindi lalabas ang "Customer Unavailable" button kapag wala ka sa exact location). I-click mo yung "Chat" tapos i-type mo "Im here", tapos i-click mo yung "Notify". Mag-antay ka ng 10 mins. Pagkatapos ng 10 mins, i-chat mo na yung support at sabihin mong wala si customer.'
      },
      {
        q: 'Paano kung bayad na yung pagkain pero wala si customer? Hindi ma-kontak si customer at hindi nag rereply sa chat',
        a: 'Kapag nasa exact location ka na ni customer, pindutin mo yung "Customer Unavailable" button (Hindi lalabas ang "Customer Unavailable" button kapag wala ka sa exact location). I-click mo yung "Chat" tapos i-type mo "Im here", tapos i-click mo yung "Notify". Mag-antay ka ng 10 mins. Pagkatapos ng 10 mins, i-chat mo na yung support at sabihin mong wala si customer. ⚠️ Wag na wag mong iu-uwi ang pagkain dahil pwede kang masuspende or marestrict. Antayin ang sasabihin ng support kung ano ang gagawin sa order. ⚠️'
      }
    ];

    const ACCEPTANCERATE = [
      {
        q: 'Paano ko mapapataas ang aking acceptance rate?',
        a: 'Para mapataas ang acceptance rate mo, kailangan mong tanggapin ang mga order na pumapasok sa iyo. Huwag i-ignore o i-decline ang mga order. Mas mabuti kung itu-turn on mo ang Auto-accept orders.'
      },
      {
        q: 'Bakit bumababa ang aking acceptance rate kahit na tinatanggap ko lahat ng order?',
        a: 'Dahilan kung bakit bumababa ang acceptance rate mo. Mabagal ang internet (May pumasok na order tapos hindi mo na-accept dahil hindi lumabas sa screen mo). Panay ang "Pause Request" (Pwede ka mag PR kapag nakapag may success deliver kana). Kumuha ka ng schedule kahit na on-going session mo.'
      }
    ];

    const TIPIDHACK = [
      {
        q: 'Ano magandang load? [Smart]',
        a: '[PANALO10] May 300 MB + 60 Mins Calls to Mobile + 60 Texts valid for 1 day. ● [SURFSAYA20] May 600 MB: 150 MB Araw-araw for Tiktok, IG, FB, ML (300 MB) + 300 MB + Unli Calls & Texts for 2 days.'
      },
      {
        q: 'Gutom at uhaw sa byahe?',
        a: '[DALI] Tubig (6 Pesos) + Choco mucho (9 Pesos). Mas maganda kumain ng chocolate because it provides an immediate, highly efficient burst of physical and mental energy'
      }
    ]

    const tabContent = {
      faq: [
        {
          q: 'Pwede ko na lang bang i-remit lahat para wala nang negative sa wallet?',
          a: 'Pwede, pero hindi mo agad makukuha nang buo ang sahod. Kailangan mo pang bumyahe para makuha ito.'
        },
        {
          q: 'Gaano ka-accurate ang calculation nito?',
          a: '100% accurate. Kung minsan, may sobrang kaunti dahil niroround up ang final amount para walang matirang negative sa wallet mo.'
        },
        {
          q: 'Anong requirements para sa "Quest"?',
          a: 'Kailangan yung acceptance rate mo ay 90% at kailangan ang no show mo ay 0. Kung ang acceptance rate mo ay 89% or may no show ka na isa, Hindi mo ito makukuha.'
        },
        {
          q: 'Paano kung mas mataas yung wallet amount kesa sa payments?',
          a: 'Pwede mo na lang hintayin na ma-transfer ang payment sa wallet mo, o i-remit ang laman ng wallet mo gamit ang GCash o sa 7-Eleven'
        }
      ],
      fakebook: FAKEBOOK,
      csunavailable: CSUNAVAILABLE,
      acceptance: ACCEPTANCERATE,
      tipidhacks: TIPIDHACK
    };

    const tabsEl = document.getElementById('tabs');
    const tabPanel = document.getElementById('tabPanel');
    let activeTab = null;

    function buildPanel(key) {
      const data = tabContent[key];
      const wrap = document.createElement('div');
      wrap.className = 'tab-panel';
      wrap.setAttribute('role', 'tabpanel');

      if (Array.isArray(data)) {
        const section = document.createElement('div');
        section.className = 'faq-section';
        data.forEach(item => {
          const faqItem = document.createElement('div');
          faqItem.className = 'faq-item';

          const q = document.createElement('button');
          q.type = 'button';
          q.className = 'faq-q';
          q.addEventListener('click', () => toggleFaq(q));

          const qText = document.createElement('span');
          qText.textContent = item.q;
          const icon = document.createElement('span');
          icon.className = 'faq-icon';
          icon.textContent = '+';
          q.append(qText, icon);

          const a = document.createElement('div');
          a.className = 'faq-a';
          const p = document.createElement('p');
          p.textContent = item.a;
          a.appendChild(p);

          faqItem.append(q, a);
          section.appendChild(faqItem);
        });
        wrap.appendChild(section);
      } else {
        const p = document.createElement('p');
        p.className = 'tab-text';
        p.textContent = data;
        wrap.appendChild(p);
      }
      return wrap;
    }

    function selectTab(key) {
      tabsEl.querySelectorAll('.tab').forEach(btn => {
        const on = btn.dataset.tab === key;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
      });

      tabPanel.textContent = '';
      activeTab = key;
      if (key) tabPanel.appendChild(buildPanel(key));
    }

    selectTab('faq');

    (function enableDragScroll(el) {
      let down = false, startX = 0, startLeft = 0, moved = false;
      el.addEventListener('mousedown', (e) => { down = true; moved = false; startX = e.pageX; startLeft = el.scrollLeft; });
      window.addEventListener('mouseup', () => { down = false; });
      window.addEventListener('mousemove', (e) => {
        if (!down) return;
        const dx = e.pageX - startX;
        if (Math.abs(dx) > 4) moved = true;
        el.scrollLeft = startLeft - dx;
      });
      el.addEventListener('click', (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
      el.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; e.preventDefault(); }
      }, { passive: false });
    })(document.getElementById('tabs'));

    function scrollTabIntoView(btn) {
      const pad = 100;
      const b = btn.getBoundingClientRect();
      const t = tabsEl.getBoundingClientRect();
      if (b.left < t.left + pad) {
        tabsEl.scrollBy({ left: b.left - t.left - pad, behavior: 'smooth' });
      } else if (b.right > t.right - pad) {
        tabsEl.scrollBy({ left: b.right - t.right + pad, behavior: 'smooth' });
      }
    }

    tabsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      if (activeTab !== btn.dataset.tab) selectTab(btn.dataset.tab);
      scrollTabIntoView(btn);
    });

    const helpContent = {
      wallet: {
        img: 'src/WalletHelp.png',
        title: 'Wallet',
        text: 'Ito ang negative balance sa wallet mo mula sa COD orders. Ilagay dito ang eksaktong amount na nakikita mo sa app.'
      },
      payments: {
        img: 'src/PaymentsHelp.png',
        title: 'Payments',
        text: 'Ito ang total na kinita mo mula sa mga delivery. Ilagay dito ang eksaktong amount na nakikita mo sa app.'
      }
    };

    const helpModal = document.getElementById('helpModal');

    function openHelp(key) {
      const data = helpContent[key];
      if (!data) return;
      const img = document.getElementById('modalImg');
      img.src = data.img;
      img.alt = data.title;
      document.getElementById('modalTitle').textContent = data.title;
      document.getElementById('modalText').textContent = data.text;
      helpModal.classList.add('open');
      helpModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeHelp() {
      helpModal.classList.remove('open');
      helpModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    document.querySelectorAll('[data-help]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        openHelp(btn.dataset.help);
      });
    });
    document.getElementById('modalClose').addEventListener('click', closeHelp);
    helpModal.addEventListener('click', (e) => {
      if (e.target === helpModal) closeHelp();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeHelp();
    });

    const questTooltip = document.getElementById('questTooltip');
    if (questTooltip) {
      const tooltipBtn = questTooltip.querySelector('.tooltip-icon');
      tooltipBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        questTooltip.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!questTooltip.contains(e.target)) {
          questTooltip.classList.remove('open');
        }
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .catch(err => console.warn('Service worker registration failed:', err));
      });
    }
  </script>
